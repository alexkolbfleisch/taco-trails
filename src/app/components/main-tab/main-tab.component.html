<div class="editor-container">
    <div class="mode-sidebar">
        <app-mode-toggle></app-mode-toggle>
    </div>
    <mat-tab-group class="flex-tab-group" [selectedIndex]="selectedIndex" (selectedTabChange)="onTabChange($event)">
        <mat-tab>
            <ng-template mat-tab-label>
                <mat-icon class="tab-icon">edit</mat-icon>
                {{ 'TAB_DRAW' | translate }}
            </ng-template>
            <app-draw></app-draw>
        </mat-tab>

        <mat-tab>
            <ng-template mat-tab-label>
                <mat-icon class="tab-icon">linear_scale</mat-icon>
                {{ 'TAB_TOKEN_TRAIL' | translate }}
            </ng-template>
            <app-token-trail></app-token-trail>
        </mat-tab>

        <mat-tab>
            <ng-template mat-tab-label>
                <mat-icon class="tab-icon">extension</mat-icon>
                {{ 'TAB_PRACTICE' | translate }}
            </ng-template>
            <app-token-trail-practice></app-token-trail-practice>
        </mat-tab>
    </mat-tab-group>
    <div class="action-sidebar">
        <app-upload></app-upload>
        <app-tuple-input-button></app-tuple-input-button>
        <app-save></app-save>
        <app-clear-net-button></app-clear-net-button>
        <app-layout-button></app-layout-button>
        <div class="divider-horizontal"></div>
        <app-example-menu></app-example-menu>
        <app-language-button></app-language-button>
    </div>
</div>
