<div class="display-container" style="position: relative; width: 100%">
    <svg
        #drawingArea
        class="canvas"
        [class.drag-over-invalid]="isDragOver()"
        [attr.viewBox]="viewBox()"
        preserveAspectRatio="xMidYMid meet"
        (drop)="processDropEvent($event)"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave()"
        (mousedown)="$event.target === drawingArea && startPan($event)"
        (mousemove)="pan($event)"
        (mouseup)="endPan()"
        (mouseleave)="endPan()"
        (wheel)="onWheel($event)">
        <defs>
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="black" />
            </marker>
        </defs>

        @for (arc of diagram()?.getEdges(); track arc.id) {
            <g appSvgArc [diagramArc]="arc" [nodes]="diagram()?.getNodes() || []" />
        }

        @for (node of diagram()?.getNodes(); track node.id) {
            <g
                appSvgNode
                [diagramNode]="node"
                [selected]="selectedPetriPlaceId() === node.id || heldPetriPlaceId() === node.id"
                [fillColorOverride]="getNodeFillColor(node)"
                (mousedown)="onNodeMouseDown($event, node)"
                style="cursor: grab"
                [showInnerLabel]="true"
                [transitionLabelPlacement]="'inside'" />
        }
    </svg>

    @if (showEmptyPlace()) {
        <div class="empty-place-container">
            <div
                class="empty-place-draggable"
                (mousedown)="onEmptyPlaceMouseDown($event)"
                [title]="'TOKEN_TRAIL.EMPTY_PLACE_TOOLTIP' | translate"
                role="button"
                tabindex="0">
                <div class="empty-place-shape"></div>
            </div>
        </div>
    }
</div>
