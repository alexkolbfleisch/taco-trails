<div class="display-container" style="position: relative; width: 100%">
    <svg
        #drawingArea
        class="canvas"
        [class.drag-over-invalid]="isDragOver()"
        [attr.viewBox]="viewBox()"
        preserveAspectRatio="xMidYMid meet"
        (drop)="processDropEvent($event)"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave()"
        (mousedown)="$event.target === drawingArea && startPan($event)"
        (mousemove)="pan($event)"
        (mouseup)="endPan()"
        (mouseleave)="endPan()"
        (wheel)="onWheel($event)">
        <defs>
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="black" />
            </marker>
        </defs>

        @for (arc of diagram()?.getEdges(); track arc.id) {
            <g appSvgArc [diagramArc]="arc" [nodes]="diagram()?.getNodes() || []" />
        }

        @for (node of diagram()?.getNodes(); track node.id) {
            <g
                appSvgNode
                [diagramNode]="node"
                [selected]="selectedPetriPlaceId() === node.id"
                [fillColorOverride]="getNodeFillColor(node)"
                (clickNode)="processNodeClick(node)"
                (mousedown)="onNodeMouseDown($event, node)"
                style="cursor: grab"
                [showInnerLabel]="true"
                [transitionLabelPlacement]="'inside'" />
        }
    </svg>

    @if (showEmptyPlace()) {
        <div
            class="empty-place-draggable"
            (mousedown)="onEmptyPlaceMouseDown($event)"
            style="
                position: absolute;
                top: 16px;
                right: 16px;
                display: flex;
                flex-direction: column;
                align-items: center;
                cursor: grab;
                z-index: 10;
            ">
            <div
                style="
                    width: 36px;
                    height: 36px;
                    border-radius: 50%;
                    border: 2px dashed #94a3b8;
                    background: white;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
                ">
                <div
                    style="
                        width: 22px;
                        height: 22px;
                        border-radius: 50%;
                        border: 2px solid #64748b;
                        background: white;
                    "></div>
            </div>
            <span style="font-size: 11px; margin-top: 4px; font-weight: bold; color: #64748b; font-family: monospace"
                >∅</span
            >
        </div>
    }
</div>
